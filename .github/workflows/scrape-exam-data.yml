name: Scrape Exam Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 15 * *'

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ./packages/data
        run: bun install

      - name: Run scraper
        working-directory: ./packages/data
        run: bun scrape

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code apps/web/public/data.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/web/public/data.json
          git commit -m "chore: update exam data [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes detected
        if: steps.git-check.outputs.changed != 'true'
        run: echo "No changes to apps/web/public/data.json - nothing to commit"
